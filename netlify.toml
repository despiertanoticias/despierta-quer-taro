[build]
  publish = "."
  command = "node scripts/build.mjs"

# Datos, scripts y estilos: el navegador siempre revisa si hay versión nueva
[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Imágenes del logo e íconos: pueden guardarse 1 hora
[[headers]]
  for = "/assets/*.png"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/assets/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "https://www.despiertaqueretaro.com/*"
  to = "https://despiertaqueretaro.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/privacy/"
  to = "/privacy"
  status = 301

[[redirects]]
  from = "/privacidad"
  to = "/privacy"
  status = 301

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200
